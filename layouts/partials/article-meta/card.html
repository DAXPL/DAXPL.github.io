<div class="flex flex-row flex-wrap items-center gap-1.5 text-xs text-neutral-500 dark:text-neutral-400 font-mono">
  {{ with .Date }}
    <time datetime="{{ .Format "2006-01-02T15:04:05Z07:00" }}">{{ .Format "02.01.2006" }}</time>
    <span class="text-secondary-500">&middot;</span>
  {{ end }}
  {{ with .ReadingTime }}
    <span>{{ . }} min</span>
  {{ end }}
</div>
{{ if .Params.categories }}
  <div class="flex flex-row flex-wrap items-center gap-1.5 mt-2">
    {{ range .GetTerms "categories" }}
      <span class="inline-block rounded-[0.25rem] bg-primary-800/30 border border-primary-600/50 px-2 py-0.5 text-[0.7rem] font-semibold tracking-wider uppercase font-mono text-primary-300">
        {{ .LinkTitle }}
      </span>
    {{ end }}
  </div>
{{ end }}
