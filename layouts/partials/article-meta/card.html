<div class="flex flex-row flex-wrap items-center gap-1.5 text-xs text-neutral-500 dark:text-neutral-400">
  {{ with .Date }}
    <time datetime="{{ .Format "2006-01-02T15:04:05Z07:00" }}">{{ .Format "02.01.2006" }}</time>
    <span class="text-primary-500">&middot;</span>
  {{ end }}
  {{ with .ReadingTime }}
    <span>{{ . }} min</span>
  {{ end }}
</div>
{{ if .Params.categories }}
  <div class="flex flex-row flex-wrap items-center gap-1.5 mt-2">
    {{ range .GetTerms "categories" }}
      <span class="inline-block rounded-md bg-primary-50 dark:bg-primary-900/40 border border-primary-200 dark:border-primary-800/60 px-2 py-0.5 text-xs font-medium text-primary-700 dark:text-primary-300">
        {{ .LinkTitle }}
      </span>
    {{ end }}
  </div>
{{ end }}
